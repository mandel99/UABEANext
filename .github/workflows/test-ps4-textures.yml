name: Test PS4 Morton textures

on:
  push:
    branches: [master, 'feature/ps4-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Test layout and image roundtrips
        run: dotnet run --project Tests/Ps4TextureTests -c Release
      - name: Build texture plugin
        run: dotnet build TexturePlugin/TexturePlugin.csproj -c Release
